<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Complaint</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f9fafb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #111827;
      padding: 20px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #0057a8;
    }
    .section-header svg {
      width: 28px;
      height: 28px;
      fill: #66b032;
    }
    /* Form card */
    .form-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgb(0 0 0 / 0.05);
      padding: 25px;
      margin-bottom: 40px;
    }
    label {
      font-weight: 600;
      color: #0057a8;
    }
    /* Inputs */
    .form-control, .form-select {
      border: 2px solid #66b032;
      transition: border-color 0.3s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #0057a8;
      box-shadow: 0 0 6px #0057a8aa;
    }
    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }
    /* Urgency */
    .urgency-label {
      font-weight: 600;
      color: #0057a8;
      margin-right: 20px;
    }
    .form-check-input:checked[type="radio"] {
      background-color: #66b032;
      border-color: #66b032;
    }
    .urgency-low .form-check-input:checked {
      background-color: #66b032;
      border-color: #66b032;
    }
    .urgency-medium .form-check-input:checked {
      background-color: #f59e0b; /* amber */
      border-color: #f59e0b;
    }
    .urgency-high .form-check-input:checked {
      background-color: #ef4444; /* red */
      border-color: #ef4444;
    }
    /* Submit Button */
    .btn-submit {
      background-color: #0057a8;
      color: white;
      font-weight: 700;
      border-radius: 8px;
      padding: 10px 25px;
      border: none;
      transition: background-color 0.3s ease;
    }
    .btn-submit:hover {
      background-color: #003f7a;
    }
    /* Complaints Table */
    .complaints-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgb(0 0 0 / 0.05);
      padding: 25px;
    }
    .table thead th {
      color: #0057a8;
      font-weight: 700;
      border-bottom: 2px solid #66b032;
    }
    .status-badge {
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      display: inline-block;
    }
    .pending {
      background-color: #fbbf24; /* yellow */
      color: #78350f;
    }
    .resolved {
      background-color: #22c55e; /* green */
      color: #14532d;
    }
    /* Actions button */
    .btn-actions {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #0057a8;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="section-header">
      <!-- Icon: complaint bag -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 7V5a6 6 0 1112 0v2h1a2 2 0 012 2v8a4 4 0 01-4 4H7a4 4 0 01-4-4v-8a2 2 0 012-2h1zm3-2a4 4 0 00-4 4v1h10v-1a4 4 0 00-4-4z" fill="#66b032"/></svg>
      Submit Complaint
    </div>

    <div class="form-card">
      <form>
        <div class="mb-3">
          <label for="complaintTitle" class="form-label">Complaint Title</label>
          <input type="text" class="form-control" id="complaintTitle" placeholder="Enter complaint title" />
        </div>
        <div class="mb-3">
          <label for="categorySelect" class="form-label">Category</label>
          <select class="form-select" id="categorySelect" aria-label="Category select">
            <option selected>Pickpacks</option>
            <option value="network">Network</option>
            <option value="maintenance">Maintenance</option>
            <option value="cleaning">Cleaning</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="descriptionInput" class="form-label">Description</label>
          <textarea class="form-control" id="descriptionInput" placeholder="Describe your complaint"></textarea>
        </div>
        <div class="mb-3">
          <label for="locationSelect" class="form-label">Location</label>
          <select class="form-select" id="locationSelect" aria-label="Location select">
            <option selected>City Center</option>
            <option value="north">North Side</option>
            <option value="park">City Park</option>
            <option value="downtown">Downtown</option>
          </select>
        </div>

        <div class="mb-4 d-flex align-items-center">
          <label class="urgency-label me-3">Urgency</label>

          <div class="form-check me-3 urgency-low">
            <input class="form-check-input" type="radio" name="urgency" id="urgencyLow" checked />
            <label class="form-check-label" for="urgencyLow">Low</label>
          </div>
          <div class="form-check urgency-high">
            <input class="form-check-input" type="radio" name="urgency" id="urgencyHigh" />
            <label class="form-check-label" for="urgencyHigh">High</label>
          </div>
        </div>

        <button type="submit" class="btn-submit">Submit Complaint</button>
      </form>
    </div>

    <div class="complaints-card">
      <h5 class="mb-4" style="color:#0057a8; font-weight:700;">My Complaints</h5>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <span><strong>Status:</strong> All</span> &nbsp; | &nbsp;
          <span><strong>Category:</strong> All</span>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Complaints</th>
              <th scope="col">Location</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>503</td>
              <td>Wi-Fi Not Working</td>
              <td>Drv Neant</td>
              <td><span class="status-badge pending">Pending</span></td>
              <td class="text-center">
                <button class="btn-actions" title="More actions">&#x22EE;</button>
              </td>
            </tr>
            <tr>
              <td>504</td>
              <td>Leaky Pipe</td>
              <td>Cito Park</td>
              <td><span class="status-badge resolved">Resolved</span></td>
              <td class="text-center">
                <button class="btn-actions" title="More actions">&#x22EE;</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
