    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Complaint - Events</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f9fafb;
      color: #111827;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .section-header {
      font-weight: 700;
      font-size: 1.5rem;
      color: #222;
    }
    .section-header svg {
      width: 28px;
      height: 28px;
      fill: #22c55e;
      margin-right: 10px;
    }
    .main-banner {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgb(0 0 0 / 0.1);
      color: white;
      position: relative;
      background-size: cover;
      background-position: center;
      height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .main-banner h2 {
      font-weight: 700;
      font-size: 2rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      margin-bottom: 0.5rem;
    }
    .main-banner p {
      font-size: 1.1rem;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
      margin-bottom: 1rem;
    }
    .btn-location {
      background: white;
      color: #0057a8;
      border-radius: 20px;
      font-weight: 600;
      padding: 0.5rem 1.25rem;
      box-shadow: 0 2px 6px rgba(0,87,168,0.4);
      border: none;
      transition: background-color 0.3s;
    }
    .btn-location:hover {
      background-color: #e0e7ff;
      color: #003f7a;
    }
    .small-card {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgb(0 0 0 / 0.07);
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    .small-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .small-card-body {
      padding: 15px;
    }
    .small-card-body h5 {
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: #111827;
    }
    .small-card-body p {
      color: #555;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .btn-register {
      background-color: #22c55e;
      color: white;
      border-radius: 20px;
      font-weight: 600;
      padding: 0.4rem 1.2rem;
      border: none;
      box-shadow: 0 3px 8px rgba(34,197,94,0.6);
      transition: background-color 0.3s;
    }
    .btn-register:hover {
      background-color: #16a34a;
      color: white;
    }
  </style>
</head>
<body>

<div class="container my-4">

  <div class="d-flex align-items-center section-header mb-4">
    <!-- Bag icon SVG -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="me-2"><path d="M6 7V5a6 6 0 1112 0v2h1a2 2 0 012 2v8a4 4 0 01-4 4H7a4 4 0 01-4-4v-8a2 2 0 012-2h1zm3-2a4 4 0 00-4 4v1h10v-1a4 4 0 00-4-4z" fill="#22c55e"/></svg>
    <span class="text-success">Submit Complaint</span>
  </div>

  <div class="row g-4">
    <!-- Main banner card -->
    <div class="col-12">
      <div class="main-banner" style="background-image: url('https://saylani-welfare-website-suneel.vercel.app/static/media/donate1.a25c372108e68fea4ea6.webp');">
        <h2 " >Community Cleanup</h2>
        
        <p>Saturday, 22th June</p>
        
      </div>
    </div>

    <!-- Small cards -->
    <div class="col-md-6">
      <div class="small-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnY26QP58A2ap3jRFdz7_m0aggVfjDHSOFqw&s" alt="Tech Workshop" class="h-75" />
        <div class="small-card-body">
          <h5 class="text-success">Tech Workshop</h5>
          <p>June 5</p>
          <button class="btn-register">Register</button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="small-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRB0wyqfekP22DtgYgpSSJQJzBVt0SPvR-iBg&s" alt="Health Camp" class="h-75" />
        <div class="small-card-body">
          <h5 class="text-success">Health Camp</h5>
          <p>July 5</p>
          <button class="btn-register">Register</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Bootstrap JS Bundle (optional for JS components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

</body>
</html>
