</head>
<body>
    




<!-- Section: Design Block -->
<section class="background-radial-gradient overflow-hidden">
  <div class="animated-bg"></div>
  <div class="container px-4 py-5 px-md-5 text-center text-lg-start my-5">
    <div class="row gx-lg-5 align-items-center mb-5">
      <div class="col-lg-6 mb-5 mb-lg-0" style="z-index: 10">
        <h1 class="my-5 display-5 fw-bold ls-tight">
          Campus Portal
          
        </h1>
        <p class="mb-4 opacity-70 lead-text">
          Manage reports, complaints & events in one place
          Lorem ipsum dolor sit amet consectetur adipisicing.
        </p>
        <!-- <div class="feature-icons">
          <div class="icon-item">
            <i class="fas fa-rocket"></i>
            <span>Fast Setup</span>
          </div>
          <div class="icon-item">
            <i class="fas fa-shield-alt"></i>
            <span>Secure</span>
          </div>
          <div class="icon-item">
            <i class="fas fa-chart-line"></i>
            <span>Analytics</span>
          </div>
        </div> -->
      </div>

      <div class="col-lg-6 mb-5 mb-lg-0 position-relative">
        <div id="radius-shape-1" class="position-absolute rounded-circle"></div>
        <div id="radius-shape-2" class="position-absolute"></div>
        <div id="radius-shape-3" class="position-absolute"></div>

        <div class="card bg-glass">
          <div class="card-body px-4 py-5 px-md-5">
            <h3 class="form-title mb-4">Create Your Account</h3>
            <form>
              <!-- 2 column grid layout with text inputs for the first and last names -->
              <div class="row">
                <div class="col-md-6 mb-4">
                  <div data-mdb-input-init class="form-outline">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="form3Example1" class="form-control" placeholder=" " />
                    <label class="form-label" for="form3Example1">First name</label>
                  </div>
                </div>
                <div class="col-md-6 mb-4">
                  <div data-mdb-input-init class="form-outline">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="form3Example2" class="form-control" placeholder=" " />
                    <label class="form-label" for="form3Example2">Last name</label>
                  </div>
                </div>
              </div>

              <!-- Email input -->
              <div data-mdb-input-init class="form-outline mb-4">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="form3Example3" class="form-control" placeholder=" " />
                <label class="form-label" for="form3Example3">Email address</label>
              </div>

              <!-- Password input -->
              <div data-mdb-input-init class="form-outline mb-4">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="form3Example4" class="form-control" placeholder=" " />
                <label class="form-label" for="form3Example4">Password</label>
              </div>

              <!-- Role Selection Buttons -->
              <a href="lost.html" target="_blank" class="btn btn-primary btn-block mb-3 w-100" style="text-decoration: none; color: white;">
                <span>Student</span>
              </a>
              <a href="flexy-bootstrap-lite-1.0.0/flexy-bootstrap-lite-1.0.0/index.html" target="_blank" class="btn btn-primary btn-block mb-4 w-100" style="text-decoration: none; color: white;">
                <span>Admin</span>
              </a>

              <!-- Submit button -->
              <button type="submit" class="btn btn-primary btn-block mb-4 w-100">
                <span>Sign up</span>
                <i class="fas fa-arrow-right ms-2"></i>
              </button>

              <!-- Register buttons -->
              <div class="text-center">
                <p>or sign up with:</p>
                <div class="social-buttons">
                  <button type="button" class="btn btn-link btn-floating mx-1" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                  </button>

                  <button type="button" class="btn btn-link btn-floating mx-1" title="Google">
                    <i class="fab fa-google"></i>
                  </button>

                  <button type="button" class="btn btn-link btn-floating mx-1" title="Facebook">                    <i class="fab fa-twitter"></i>
                  </button>

                  <button type="button" class="btn btn-link btn-floating mx-1" title="Facebook">                    <i class="fab fa-github"></i>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
